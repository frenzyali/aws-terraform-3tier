name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

# No cloud credentials are used anywhere in this workflow: every step is static
# analysis (init -backend=false never contacts AWS).
jobs:
  validate:
    name: fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.9.0"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init + validate
        run: |
          for dir in . bootstrap; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        env:
          # Only raises the GitHub API rate limit when downloading the AWS ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install --no-cache-dir "checkov==3.3.24"

      # Not soft-fail: findings fail the build. The deliberate exceptions are
      # inline `#checkov:skip=` comments next to each resource, each with a
      # reason, and are listed in the README.
      - name: checkov
        run: checkov -d . --framework terraform --compact --quiet
